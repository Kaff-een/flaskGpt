{% extends "base.html" %}

{% block title %}Erreur {{ code }} — FlaskGPT{% endblock %}

{% block content %}
<div class="flex min-h-[100dvh] items-center justify-center px-4">
    <div class="w-full max-w-lg rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-xl shadow-slate-200/50">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-rose-50 text-rose-500">
            <svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.9L2.8 17a2 2 0 001.7 3h15a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
        </div>
        <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Erreur {{ code }}</p>
        <h1 class="mt-2 text-xl font-bold text-slate-900">La page n'a pas pu être affichée</h1>
        <p class="mt-2 text-sm text-slate-500">{{ message }}</p>
        <div class="mt-6 flex justify-center gap-2">
            <a href="/" class="rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700">Retour à l'assistant</a>
            <button type="button" onclick="history.back()" class="rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50">Page précédente</button>
        </div>
    </div>
</div>
{% endblock %}
